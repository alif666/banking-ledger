spring.application.name=demo-app
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5433/demo-app
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:demo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

security.jwt.issuer=demo-api
security.jwt.access-token-ttl=PT10M
security.jwt.secret=${JWT_SECRET}
security.jwt.refresh-token-ttl = PT720H
